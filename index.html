<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>دفترچه یادداشت آنلاین</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body class="bg-light text-dark">

<div class="container py-5">
  <div class="card shadow p-4">
    <h3 class="mb-3 text-center">📘 دفترچه یادداشت من</h3>

    <div class="text-center my-3">
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
        افزودن یادداشت
      </button>
    </div>

    <div id="notesContainer" class="row g-3"></div>
  </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">افزودن یادداشت جدید</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <textarea id="newNoteText" class="form-control" rows="3" placeholder="متن یادداشت..."></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
        <button type="button" id="saveNewNote" class="btn btn-success">ذخیره</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">✏️ ویرایش یادداشت</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <textarea id="editText" class="form-control" rows="4"></textarea>
        <input type="hidden" id="editId">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">لغو</button>
        <button type="button" class="btn btn-primary" id="saveEdit">ذخیره تغییرات</button>
      </div>
    </div>
  </div>
</div>

<script>
  function loadNotes() {
    $.get("server.php", { action: "read" }, function(response) {
      const container = $("#notesContainer");
      container.empty();

      if (response.length === 0) {
        container.html("<p class='text-center text-muted'>هیچ یادداشتی وجود ندارد</p>");
        return;
      }

      response.forEach((note) => {
        container.append(`
          <div class="col-md-4">
            <div class="card p-3 shadow-sm note-card">
              <p>${note.text}</p>
              <small class="text-muted d-block mt-2">• ${note.date || 'بدون تاریخ'}</small>
              <div class="d-flex gap-2 mt-3">
                <button class="btn btn-sm btn-outline-warning flex-grow-1" onclick="editNote('${note.id}')">
                  ویرایش
                </button>
                <button class="btn btn-sm btn-outline-danger flex-grow-1" onclick="deleteNote('${note.id}')">
                  حذف
                </button>
              </div>
            </div>
          </div>
        `);
      });
    }, "json");
  }

  $("#saveNewNote").click(function() {
    const text = $("#newNoteText").val().trim();
    if (!text) return;

    fetch("server.php", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ action: "add", text })
    })
    .then(res => res.json())
    .then(() => {
      $("#newNoteText").val("");
      const modal = bootstrap.Modal.getInstance(document.getElementById("addModal"));
      modal.hide();
      loadNotes();
    });
  });

  function deleteNote(id) {
    if (!confirm("آیا مطمئنید می‌خواهید این یادداشت حذف شود؟")) return;

    $.post("server.php", { action: "delete", id: id }, function() {
      loadNotes();
    }).fail(() => alert("خطا در حذف یادداشت"));
  }

  function editNote(id) {
    $.get("server.php", { action: "read" }, function(notes) {
      const note = notes.find(n => n.id === id);
      if (note) {
        $("#editText").val(note.text);
        $("#editId").val(id);
        const modal = new bootstrap.Modal(document.getElementById('editModal'));
        modal.show();
      }
    }, "json");
  }

  $("#saveEdit").click(function() {
    const newText = $("#editText").val().trim();
    const id = $("#editId").val();
    if (!newText) return alert("متن نمی‌تواند خالی باشد!");

    $.post("server.php", { action: "edit", id: id, text: newText }, function() {
      loadNotes();
      const modal = bootstrap.Modal.getInstance(document.getElementById('editModal'));
      modal.hide();
    }).fail(() => alert("خطا در ویرایش یادداشت"));
  });

  $(document).ready(loadNotes);
</script>

</body>
</html>
